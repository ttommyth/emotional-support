name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
      channel:
        description: "Release channel"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - rc

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci --prefix webview-ui

      - name: Set extension version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): v${{ inputs.version }}"
            git push
          fi

      - name: Publish release candidate
        if: ${{ inputs.channel == 'rc' }}
        run: npx @vscode/vsce publish --pre-release --pat ${{ secrets.VSCE_PAT }}

      - name: Publish release
        if: ${{ inputs.channel == 'release' }}
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}