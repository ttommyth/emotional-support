name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - rc

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci --prefix webview-ui

      - name: Determine version bump from commits
        id: bump
        run: |
          npm_config_yes=true npx -p conventional-recommended-bump -p conventional-changelog-angular \
            conventional-recommended-bump -p angular > .bump_type
          BUMP_TYPE=$(cat .bump_type)
          if [ -z "$BUMP_TYPE" ]; then
            echo "Unable to determine bump type."
            exit 1
          fi
          echo "type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Set extension version
        run: |
          if [ "${{ inputs.channel }}" = "rc" ]; then
            npm version pre${{ steps.bump.outputs.type }} --preid=rc --no-git-tag-version
          else
            npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            VERSION=$(node -p "require('./package.json').version")
            git commit -m "chore(release): v${VERSION}"
            git push
          fi

      - name: Publish release candidate
        if: ${{ inputs.channel == 'rc' }}
        run: npx @vscode/vsce publish --pre-release --pat ${{ secrets.VSCE_PAT }}

      - name: Publish release
        if: ${{ inputs.channel == 'release' }}
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}
